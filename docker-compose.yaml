services:
  backend:
    build: ./backend
    expose:
      - "5050"
    networks:
      - app_network
    environment:
      MONGO_URI: mongodb://mongodb:27017/appdb
    depends_on:
      - mongodb
    restart: always  

  frontend:
    build: ./frontend
    expose:
      - "5173"
    networks:
      - app_network

  mongodb:
    image: mongo:latest
    expose:
      - "27017"
    networks:
      - app_network
    volumes:
      - mongo-data:/data/db
    restart: always  

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - app_network
    restart: always  
 
networks:
  app_network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
