apiVersion: v1
kind : Deployment
metadata:
  name: backend
  namespace: mern-app
spec:
  replicas: 1
  selector:
    matchLabels: 
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: gopinathbca35/mern_stack_with_docker-backend:latest
          ports:
            - containerPort: 5050
