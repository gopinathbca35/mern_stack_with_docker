apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: mern-app
spec:
  serviceName: mongodb
  replicas: 1

  selector:
    matchLabels: 
      app: mongodb

  template:
    metadata: 
      labels:
        app: mongodb
    spec:
      containers: 
        - name: mongodb
          image: mongo:6.0
          ports:
            - containerPort: 27017
                    resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"  
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db 
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 5
  
  volumeClaimTemplates:
    - metadata: 
        name: mongo-storage
      spec:
        accessModes:
          - ReadWriteOnce 
        resources:
          requests:
            storage: 2Gi  
            
                 
